# The base layer: files every generated project gets, whatever the selection.
# It is not a component kind and is never selected. Its templates live in
# files/root/ only; they reach the layout through .Slots like any template.
title: Project tooling
description: Makefile, Dockerfile, CI workflow, Dependabot, and golangci-lint configuration.

# Contribution points. A component of any kind contributes to a point with
# contrib/<point>.tmpl in its directory. Contributions are rendered with the
# usual template data, trimmed of leading and trailing newlines, and joined
# with newlines in kind order. Write them at column zero; the base templates
# indent them. A new point needs an entry here and one {{contrib "<point>"}}
# in a base template.
contributions:
  make: >-
    Makefile lines after the variables (GO, BINARY, IMAGE, GOLANGCI_LINT,
    DOCKER_RUN_FLAGS): variable assignments such as
    "DOCKER_RUN_FLAGS += ...", or whole targets with their own .PHONY line.
  make-generate: >-
    Commands of `make generate`, one per line, without the leading tab. The
    target exists only when some component contributes.
  ci-services: >-
    Service containers of the CI job, as entries of its services: mapping
    (for example "postgres:" followed by its image, ports, and options).
  ci-env: >-
    Environment variables of the CI job, as entries of its env: mapping
    (for example "TEST_DATABASE_URL: ...").
  ci-steps: >-
    Steps of the CI job after Go is set up and before the tidy check, build,
    lint, and tests, as YAML sequence entries ("- name: ..."). Use it for
    code generation and for checks that generated code is current.
  docker-build: >-
    Dockerfile instructions in the build stage, after the sources are copied
    and before the binary is built (for example code generation, or
    preparing directories for the runtime stage under /out).
  docker-runtime: >-
    Dockerfile instructions in the runtime stage, after the binary is copied
    and before USER and ENTRYPOINT (for example COPY --from=build, ENV,
    VOLUME). The runtime image has no shell, so RUN does not work here.
  dockerignore: >-
    .dockerignore patterns, one per line, for files that must not reach the
    build context (for example local database files).
  readme-docker: >-
    Markdown paragraphs for the README's Docker section: what the component
    needs at run time in a container (data volumes, connection strings).
