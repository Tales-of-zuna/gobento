# Contribution points of the frontend kind: places in a frontend's files
# where a CSS framework (the css kind) inserts its contributions. A frontend
# includes a point with {{contrib "<point>"}} in its templates; it includes
# only the points of its build system (the trait frontend-build), and a CSS
# framework contributes only to those, guarded by the same trait.
contributions:
  # frontend-build: go
  stylesheet: >-
    The complete stylesheet served as /static/styles.css, in place of the
    frontend's plain CSS. It styles the frontend's markup, whose classes the
    frontend documents (htmx: row, empty, problem, and name).
  # frontend-build: vite
  vite-config-imports: >-
    JavaScript import lines at the top of the Vite configuration
    (vite.config.*), for example a Vite plugin's import.
  css-imports: >-
    CSS lines at the top of the app's main stylesheet, before its own
    rules, for example an @import of the CSS framework.
  npm-dev-dependencies: >-
    npm packages with exact versions, one "<name>@<version>" per line, that
    the frontend installs as development dependencies after scaffolding.
