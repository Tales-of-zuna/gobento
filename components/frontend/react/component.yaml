name: react
title: React
description: A React single-page app in TypeScript, scaffolded with create-vite, built with Vite, and embedded in the Go binary.
provides:
  # Built with Vite from the Node.js sources in frontend/.
  frontend-build: vite
scaffold:
  # npm create vite@<version> frontend -- --template react-ts; the version
  # is npm.create-vite in versions.yaml.
  with: create-vite
  template: react-ts
  dir: frontend
  # Demo files the example page (src/App.tsx, src/index.css) leaves unused.
  remove: [src/App.css, src/assets]
