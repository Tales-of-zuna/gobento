name: vue
title: Vue
description: A Vue single-page app in TypeScript, scaffolded with create-vite, built with Vite, and embedded in the Go binary.
provides:
  # Built with Vite from the Node.js sources in frontend/.
  frontend-build: vite
scaffold:
  # npm create vite@<version> frontend -- --template vue-ts; the version
  # is npm.create-vite in versions.yaml.
  with: create-vite
  template: vue-ts
  dir: frontend
  # Demo files the example page (src/App.vue, src/style.css) leaves unused.
  remove: [src/components, src/assets]
