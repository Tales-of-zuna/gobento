# Version-compatibility rules for generated projects.
#
# Every version a generated project uses comes from this file; templates never
# contain version numbers. A range is a space-separated list of comparators
# (>=, >, <=, <, =) that must all hold. Library modules may be pinned by users
# inside their range with --pin; tool modules have an exact range and are fixed
# per gobento release. CI generates every supported selection with the
# defaults and with the range floors, so both ends of each range are tested.
#
# Last checked against the Go module proxy: 2026-11-03.

go:
  range: ">=1.26 <1.28"
  default: "1.27"

modules:
  modernc.org/sqlite:
    components: [database/sqlite]
    role: library
    # v1.61.0 is the oldest release confirmed to build without cgo on
    # linux, darwin, and windows (amd64 and arm64) with the "sqlite" driver.
    range: ">=v1.61.0 <v2.0.0"
    default: v1.61.1
    constraints:
      - when: ">=v1.61.0"
        require: { go: ">=1.26" }

  github.com/sqlc-dev/sqlc:
    components: [data/sqlc]
    role: tool # run with go run; never added to go.mod
    range: "=v1.31.1"
    default: v1.31.1
