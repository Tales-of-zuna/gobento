# Continuous integration: the checks of `make check`, and a build of the
# container image. Actions are pinned by full commit SHA; Dependabot
# (.github/dependabot.yml) keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that the sqlc code is current
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: Check that the templ code is current
        run: |
          go generate ./internal/views
          if [ -n "$(git status --porcelain -- internal/views)" ]; then
            git status --short -- internal/views
            git diff -- internal/views
            echo "::error::the templ code in internal/views is stale; run make generate and commit the result"
            exit 1
          fi
      - name: Check that the Tailwind CSS is current
        run: |
          go run ./internal/tools/tailwindcss --input tailwind.css --output internal/views/static/styles.css --minify
          if [ -n "$(git status --porcelain -- internal/views/static/styles.css)" ]; then
            git diff --stat -- internal/views/static/styles.css
            echo "::error::internal/views/static/styles.css is stale; run make generate and commit the result"
            exit 1
          fi
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test
        run: go test -race ./...

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag shop .
