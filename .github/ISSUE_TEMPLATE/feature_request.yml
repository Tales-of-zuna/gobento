name: Feature request
description: Suggest an improvement or a new capability for gobento.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. To ask for a new framework, database, data access library, architecture, or frontend, please use the **Component request** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the use case, not only the solution.
      placeholder: I always have to ... when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like gobento to behave? Example commands or output are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or considered.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      description: Behavior changes start as an OpenSpec proposal; see CONTRIBUTING.md.
      options:
        - "Yes, I would like to propose and implement it"
        - "Maybe, with some guidance"
        - "No"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
