# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown: # wait before proposing brand-new releases (supply-chain safety)
      default-days: 7
    commit-message:
      prefix: build # PR titles become "build(deps): ..." (Conventional Commits)
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci # PR titles become "ci(deps): ..."
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm # the website; pnpm-lock.yaml is supported
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build # PR titles become "build(deps): ..."
      include: scope
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades of the toolchain are planned changes (an OpenSpec proposal),
    # not automatic PRs: @types/node must match the Node major in website/.nvmrc,
    # and TypeScript, Next.js, React and three/R3F majors need compatibility work.
    # Security updates are not affected by this list.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react*"
        update-types: [version-update:semver-major]
      - dependency-name: three
        update-types: [version-update:semver-major]
      - dependency-name: "@types/three"
        update-types: [version-update:semver-major]
      - dependency-name: "@react-three/*"
        update-types: [version-update:semver-major]
