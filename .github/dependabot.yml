# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown: # wait before proposing brand-new releases (supply-chain safety)
      default-days: 7
    commit-message:
      prefix: build # PR titles become "build(deps): ..." (Conventional Commits)
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci # PR titles become "ci(deps): ..."
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm # the website; pnpm-lock.yaml is supported
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build # PR titles become "build(deps): ..."
      include: scope
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]
