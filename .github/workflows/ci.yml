# Continuous integration: the same checks as `make lint test`, on every OS.
# Third-party actions are pinned by full commit SHA (Dependabot updates them).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # keep in sync with CONTRIBUTING.md
      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git diff -- go.mod go.sum
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy' and commit the result"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests (with race detector)
        if: runner.os != 'Windows'
        run: go test -short -race ./...
      - name: Unit tests
        # The race detector needs cgo, which Windows runners lack by default.
        if: runner.os == 'Windows'
        run: go test -short ./...

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # scan with the latest patched toolchain, as users build with
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  actions:
    name: actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  integration:
    # Generates every supported selection with default and floor versions
    # and builds, vets, and tests each project (internal/generate).
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest Go in the go range of components/versions.yaml.
          go-version: "1.27"
          cache: true
      - name: Integration tests
        run: go test -count=1 -run TestIntegration ./internal/generate/

  sqlc-fresh:
    # The sqlc component ships generated code. Regenerate it with the pinned
    # sqlc inside a generated project and fail if anything changes.
    name: sqlc output is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # newest Go in versions.yaml: the reference project defaults to it
      - name: Generate the reference project
        run: go run ./cmd/gobento new shop --module example.com/shop --dir "$RUNNER_TEMP/shop"
      - name: Regenerate with the pinned sqlc and compare
        working-directory: ${{ runner.temp }}/shop
        run: |
          git init --quiet
          git add --all
          git -c user.name=ci -c user.email=ci@example.invalid commit --quiet --message generated
          # The generated README holds the exact command, with the pinned version.
          regenerate=$(grep -o 'go run github.com/sqlc-dev/sqlc/cmd/sqlc@v[^ ]* generate' README.md)
          echo "$regenerate"
          $regenerate
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            echo "::error::the shipped sqlc output is stale; regenerate it as described in docs/components.md"
            exit 1
          fi
