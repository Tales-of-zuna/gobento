# Pull requests are squash-merged and the PR title becomes the commit message
# on main, so the title must follow Conventional Commits (see CONTRIBUTING.md).
#
# pull_request_target runs with the base repository's token so it also works
# for pull requests from forks. This workflow is safe because it never checks
# out or runs code from the pull request and only has read access.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
